<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Functional Tool</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<!-- ============ Login ============ -->
<div id="login-view" class="login-wrap hidden">
  <form class="login-card" id="login-form">
    <h1>Functional Tool</h1>
    <p class="sub">Sign in to continue</p>

    <label for="login-email">Email</label>
    <input type="email" id="login-email" autocomplete="username" required />

    <label for="login-password">Password</label>
    <input type="password" id="login-password" autocomplete="current-password" required />

    <p class="error hidden" id="login-error"></p>

    <p class="warn-note hidden" id="file-warning">
      This page was opened straight from the filesystem, so it cannot reach the server
      however healthy the server is. Start it with <code>npm start</code> and open
      <a href="http://localhost:3000">http://localhost:3000</a> instead.
    </p>

    <button type="submit" class="btn-primary btn-block" id="login-submit">Sign in</button>
  </form>
</div>

<!-- ============ App ============ -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <a class="logo" href="/dashboard">Functional Tool</a>

    <!-- Profile lives behind the avatar rather than taking a tab of its own -->
    <div class="account">
      <button type="button" class="avatar sm" id="topbar-avatar"
              aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">A</button>
      <div class="account-menu hidden" id="account-menu" role="menu">
        <div class="account-head">
          <span class="identity-name" id="topbar-name"></span>
          <span class="account-email" id="topbar-email"></span>
          <span class="role-chip" id="role-chip"></span>
        </div>
        <a class="account-item" href="/profile" role="menuitem">Profile</a>
        <a class="account-item" href="/profile#password" role="menuitem">Change password</a>
        <button type="button" class="account-item danger" id="logout" role="menuitem">Log out</button>
      </div>
    </div>
  </header>

  <!-- Tabs are rendered from the route table, filtered by role -->
  <nav class="tabs"></nav>

  <main>
    <section class="panel active" id="view"></section>
  </main>
</div>

<!-- Modals mount here; only one is ever open -->
<div id="modal-root" class="hidden"></div>
<div id="toast" class="toast hidden"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
